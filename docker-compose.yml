services:
  postgres:
    image: postgres:16-alpine
    container_name: media_gallery_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-media_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-media_pass}
      POSTGRES_DB: ${DB_NAME:-media_gallery}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-media_user} -d ${DB_NAME:-media_gallery}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    container_name: media_gallery_postgres_test
    environment:
      POSTGRES_USER: ${DB_USER:-media_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-media_pass}
      POSTGRES_DB: media_gallery_test
    ports:
      - "${DB_TEST_PORT:-5433}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-media_user} -d ${TEST_DB_NAME:-media_gallery_test}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  postgres_test_data: