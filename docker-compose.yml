# docker-compose.yml
services:
  postgres:
    image: postgres:16-alpine
    container_name: media_gallery_postgres
    environment:
      POSTGRES_DB: media_gallery
      POSTGRES_USER: media_user
      POSTGRES_PASSWORD: media_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media_user -d media_gallery"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - media-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: media_gallery_api
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: "8080"
      DB_DSN: postgres://media_user:media_pass@postgres:5432/media_gallery?sslmode=disable
      STORAGE_ROOT: /app/storage
      WORKER_COUNT: "1"
      LEASE_DURATION: 5m
      MAX_UPLOAD_SIZE: "52428800"
      API_KEY: "dev-api-key-change-me"
      FFMPEG_PATH: "ffmpeg"
      FFPROBE_PATH: "ffprobe"
      LOG_LEVEL: "info"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
    networks:
      - media-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: media_gallery_worker
    environment:
      DB_DSN: postgres://media_user:media_pass@postgres:5432/media_gallery?sslmode=disable
      STORAGE_ROOT: /app/storage
      WORKER_COUNT: "1"
      CONCURRENCY_LIMIT: "2"
      LEASE_DURATION: 5m
      MAX_UPLOAD_SIZE: "52428800"
      API_KEY: "dev-api-key-change-me"
      FFMPEG_PATH: "ffmpeg"
      FFPROBE_PATH: "ffprobe"
      LOG_LEVEL: "info"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
    networks:
      - media-network

volumes:
  postgres_data:

networks:
  media-network:
    driver: bridge